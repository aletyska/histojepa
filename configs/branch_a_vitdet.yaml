# Phase 2 — Branch A: ViTDet Supervised Tumor Bud Detection Configuration
# Ref: Li et al., "Exploring Plain Vision Transformer Backbones for Object Detection"
# (papers/vitdet/vitdet.md), §3 "Simple feature pyramid" & Appendix 0.A.2

data:
  root: data
  train_split: train
  val_split: val
  test_split: test
  image_size: 1280
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  augment_train: true
  num_workers: 4

backbone:
  frozen_encoder_dir: outputs/phase1_ijepa/context_encoder_frozen
  hidden_size: 768
  patch_size: 16

sfp:
  in_channels: 768
  out_channels: 256

head:
  in_channels: 256
  num_classes: 1               # class 0: Tumor Bud (TB)
  num_convs: 4                 # 4 hidden 3x3 conv + LayerNorm2d + GELU layers per tower
  prior_prob: 0.01
  strides: [4, 8, 16, 32]      # P2, P3, P4, P5 strides
  scale_ranges:
    - [0.0, 48.0]              # P2: small tumor buds
    - [48.0, 96.0]             # P3: medium-small tumor buds (covers median 69px)
    - [96.0, 192.0]            # P4: medium-large tumor buds
    - [192.0, 100000000.0]     # P5: large tumor buds
  center_sampling_radius: 1.5
  focal_alpha: 0.25
  focal_gamma: 2.0

optimization:
  epochs: 30
  micro_batch_size: 2          # tuned for 1280x1280 with frozen backbone
  grad_accum_steps: 8          # effective batch size = 16
  warmup_epochs: 3
  lr: 1.0e-4                   # Ref: ViTDet Table 11 (lr = 1e-4 for pre-trained ViT-B)
  min_lr: 1.0e-6
  weight_decay: 0.05
  max_grad_norm: 1.0
  amp_dtype: bfloat16
  seed: 42

evaluation:
  score_threshold: 0.25
  nms_iou_threshold: 0.50
  max_detections: 300
  eval_every_epochs: 1

output:
  dir: outputs/phase2_branch_a
  save_every_epochs: 1
  keep_last: 3
