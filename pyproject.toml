[project]
name = "histojepa"
version = "0.1.0"
description = "Joint Embedding Predictive Architecture for clustering and detection of tumor buds in colorectal cancer (TB-YOLO)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.0",
    "torch>=2.14.1",
]

[project.scripts]
histojepa = "histojepa:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
